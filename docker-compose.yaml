services:
  telemt:
    image: whn0thacked/telemt-docker:3.3.39
    container_name: telemt
    restart: unless-stopped

    environment:
      RUST_LOG: "info"

    volumes:
      - ./telemt.toml:/etc/telemt.toml:ro
      - ./runtime:/etc/telemt

    # Only the proxy endpoint is public. Administrative and metrics endpoints
    # stay reachable from the host but are not published externally.
    ports:
      - "443:443/tcp"
      - "127.0.0.1:9091:9091/tcp"
      - "127.0.0.1:9092:9092/tcp"

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=16m

    networks:
      - telemt-net

    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.25"
          memory: 128M

    ulimits:
      nofile:
        soft: 65536
        hard: 65536

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  telemt-net:
    name: telemt-net
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: "1376"
